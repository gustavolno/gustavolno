<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-label="rebuyer-frontend: Marketplace de revenda de ingressos, com modo escuro e consumo de API REST.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a0c"/><stop offset="1" stop-color="#0A0101"/></linearGradient>
<linearGradient id="fio" x1="0" x2="1"><stop offset="0" stop-color="#FF4D4D" stop-opacity="0"/><stop offset=".5" stop-color="#FF4D4D"/><stop offset="1" stop-color="#FF4D4D" stop-opacity="0"/></linearGradient>
<radialGradient id="luz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8a1426" stop-opacity=".7"/><stop offset="1" stop-color="#5e0b15" stop-opacity="0"/></radialGradient>
<clipPath id="q"><rect x="1" y="1" width="478" height="188" rx="14"/></clipPath>
</defs>
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.t{font-size:24px;font-weight:700;fill:#F4EDED}
.d{font-size:15px;fill:#C9BDBD}
.k{font-size:13px;fill:#FF7A7A;font-weight:600;letter-spacing:.3px}
.g{font-size:12px;font-weight:700;fill:#FF4D4D;letter-spacing:.6px}
.luz{animation:d 14s ease-in-out infinite alternate}
.varre{animation:v 5s ease-in-out infinite}
@keyframes d{from{transform:translate(0,0)}to{transform:translate(-120px,30px)}}
@keyframes v{0%{transform:translateX(-340px)}100%{transform:translateX(480px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect x=".5" y=".5" width="479" height="189" rx="14" fill="url(#bg)" stroke="#4a0d16"/>
<g clip-path="url(#q)">
<circle class="luz" cx="430" cy="30" r="150" fill="url(#luz)"/>
<rect class="varre" x="0" y="1" width="340" height="2" fill="url(#fio)"/>
</g>
<rect x="28" y="26" width="78" height="24" rx="12" fill="#2a0d12" stroke="#5e0b15"/>
<text x="39" y="42" class="g">PÚBLICO</text>
<text x="28" y="82" class="t">rebuyer-frontend</text>
<text x="28" y="108" class="d">Marketplace de revenda de ingressos,</text><text x="28" y="130" class="d">com modo escuro e consumo de API REST.</text>
<text x="28" y="168" class="k">React · Vite · Tailwind</text>
</svg>