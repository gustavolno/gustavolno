<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="118" viewBox="0 0 1000 118" role="img" aria-label="Stack principal: Python, FastAPI, JavaScript, React, SQL. Também já usei: Tailwind, NestJS, Dart, Git, Qlik Sense, OCR, Playwright.">
<style>
